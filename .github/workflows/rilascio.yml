# Costruisce l'installatore di MirrorLoop per Windows: ricevitore con .NET incluso, plugin per OBS e
# installatore Inno Setup (windows/installatore/MirrorLoop.iss), più lo zip del solo plugin.
# A mano: i file restano come artefatto dell'esecuzione. Con un tag "v<versione>" (es. v0.14.0):
# anche una GitHub Release in bozza, visibile a tutti solo dopo averla pubblicata a mano dal sito.
name: Rilascio Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installatore:
    # Windows Server 2022, come il workflow del plugin: Visual Studio 2022 per il plugin e Inno Setup 6
    # già installato sull'immagine.
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      numero: ${{ steps.versione.outputs.numero }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v7

      # Un solo numero di versione per tutto MirrorLoop: se ricevitore, plugin e app non coincidono ci
      # si ferma qui, prima di costruire qualcosa con il numero sbagliato.
      - name: Controlla la versione
        id: versione
        run: |
          [xml]$progetto = Get-Content windows/src/MirrorLoop.Ricevitore/MirrorLoop.Ricevitore.csproj
          $ricevitore = ($progetto.Project.PropertyGroup | Where-Object { $_.Version }).Version
          $plugin = (Get-Content obs/buildspec.json -Raw | ConvertFrom-Json).version
          $app = [regex]::Match((Get-Content ios/project.yml -Raw), 'MARKETING_VERSION: "([^"]+)"').Groups[1].Value
          "ricevitore $ricevitore · plugin $plugin · app $app"
          if ($ricevitore -ne $plugin -or $ricevitore -ne $app) {
            Write-Output "::error::Le versioni non coincidono"
            exit 1
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$ricevitore") {
            Write-Output "::error::Il tag $env:GITHUB_REF_NAME non corrisponde alla versione $ricevitore"
            exit 1
          }
          "numero=$ricevitore" >> $env:GITHUB_OUTPUT

      - name: Installa .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Pubblica il ricevitore (con .NET incluso)
        run: dotnet publish windows/src/MirrorLoop.Ricevitore -c Release -r win-x64 --self-contained true -o ${{ runner.temp }}/ricevitore

      # Il plugin come nel workflow "Plugin OBS" (stessa cache delle dipendenze di OBS).
      - name: Dipendenze di OBS (dalla cache se ci sono)
        uses: actions/cache@v6
        with:
          path: obs/.deps
          key: obs-deps-windows-x64-${{ hashFiles('obs/buildspec.json', 'obs/cmake/**') }}

      - name: Compila il plugin
        working-directory: obs
        run: |
          cmake --preset windows-ci-x64
          cmake --build --preset windows-ci-x64
          cmake --install build_x64 --config RelWithDebInfo --prefix ${{ runner.temp }}/plugin

      - name: Costruisci l'installatore
        working-directory: windows/installatore
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DVersione=${{ steps.versione.outputs.numero }} "/DCartellaRicevitore=${{ runner.temp }}\ricevitore" "/DCartellaPlugin=${{ runner.temp }}\plugin" "/O${{ runner.temp }}\installatore" MirrorLoop.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Per chi installa i plugin a mano (o usa OBS portatile): la cartella "mirrorloop" va estratta
      # nella cartella dei plugin di OBS, con la licenza GPL accanto come nell'installatore.
      - name: Prepara lo zip del plugin
        run: |
          Copy-Item obs/LICENSE ${{ runner.temp }}/plugin/mirrorloop/LICENSE-GPL-2.0.txt
          Compress-Archive -Path ${{ runner.temp }}/plugin/mirrorloop -DestinationPath ${{ runner.temp }}/installatore/MirrorLoop-${{ steps.versione.outputs.numero }}-plugin-OBS.zip
          Get-ChildItem ${{ runner.temp }}/installatore | Select-Object Name, Length

      - name: Pubblica i file come artefatto
        uses: actions/upload-artifact@v7
        with:
          name: MirrorLoop-${{ steps.versione.outputs.numero }}-Windows
          path: ${{ runner.temp }}/installatore/*
          if-no-files-found: error

  # Lavoro a parte perché è l'unico che può scrivere nel repository: la compilazione qui sopra, che
  # esegue anche codice scaricato (CMake, dipendenze di OBS), resta in sola lettura.
  release:
    needs: installatore
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Scarica i file costruiti
        uses: actions/download-artifact@v8
        with:
          name: MirrorLoop-${{ needs.installatore.outputs.numero }}-Windows
          path: file

      - name: Crea la Release in bozza
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSIONE: ${{ needs.installatore.outputs.numero }}
        run: |
          cat > note.md <<'FINE'
          - **Installatore (.exe)**: per Windows 11, con il ricevitore (.NET incluso) e, se scelto, il plugin per OBS Studio.
          - **Plugin OBS (.zip)**: solo il plugin, per chi lo installa a mano: estrarre la cartella `mirrorloop` in `C:\ProgramData\obs-studio\plugins\`.

          L'installatore non è ancora firmato: Windows può mostrare "Windows ha protetto il PC" → *Ulteriori informazioni* → *Esegui comunque*.
          FINE
          gh release create "$GITHUB_REF_NAME" file/* --draft --verify-tag --title "MirrorLoop $VERSIONE" --notes-file note.md
