# Compila l'app iOS su una macchina macOS di GitHub.
# - "compila": controllo senza firma, per ogni modifica (anche nelle pull request).
# - "testflight": solo sul ramo main o a mano; firma con certificato e profilo presi
#   dai segreti del repository e carica la build su App Store Connect per TestFlight.
#   I segreti non vengono mai passati ai lavori delle pull request.
name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compila:
    # ScreenCaptureKit su iOS richiede il kit di iOS 27, cioè Xcode 27
    # (immagine "xcode-27" di GitHub, in anteprima).
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v7

      - name: Installa XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodebuild -version

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila senza firma
        run: |
          xcodebuild build \
            -project MirrorLoop.xcodeproj \
            -scheme MirrorLoop \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # Ogni testo del codice deve avere la traduzione italiana nel catalogo.
      - name: Controlla le traduzioni
        run: python3 strumenti/controlla_traduzioni.py build MirrorLoop/Localizable.xcstrings

      # I calcoli dell'abbinamento confrontati con l'esempio di docs/protocollo.md, su un iPhone
      # simulato: il primo iPhone disponibile con il sistema più recente installato sulla macchina.
      - name: Test dell'abbinamento (simulatore)
        run: |
          DISPOSITIVO=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          dispositivi = json.load(sys.stdin)["devices"]
          sistemi = sorted((k for k in dispositivi if ".iOS-" in k),
                           key=lambda k: [int(x) for x in k.rsplit(".iOS-", 1)[1].split("-")], reverse=True)
          for sistema in sistemi:
              iphone = [d for d in dispositivi[sistema] if d["name"].startswith("iPhone")]
              if iphone:
                  print(iphone[0]["udid"], end="")
                  break
          ')
          xcrun simctl list devices available | grep "$DISPOSITIVO"
          xcodebuild test \
            -project MirrorLoop.xcodeproj \
            -scheme MirrorLoopTests \
            -destination "id=$DISPOSITIVO" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # ScreenCaptureKit su iOS richiede il kit di iOS 27, cioè Xcode 27
    # (immagine "xcode-27" di GitHub, in anteprima).
    runs-on: xcode-27
    timeout-minutes: 30
    # Un caricamento alla volta: due build in parallelo potrebbero arrivare in ordine sbagliato.
    concurrency:
      group: testflight
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ios
    env:
      # ID numerico dell'app su App Store Connect (pubblico, compare nei link dell'App Store).
      APP_ID_ASC: "6825028097"
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v7

      - name: Installa XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodebuild -version

      - name: Genera il progetto Xcode
        run: xcodegen generate

      # Procedura della guida ufficiale di GitHub "Signing Xcode applications":
      # portachiavi temporaneo, distrutto insieme alla macchina a fine lavoro.
      - name: Importa certificato e profilo
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATO=$RUNNER_TEMP/certificato.p12
          PROFILO=$RUNNER_TEMP/profilo.mobileprovision
          PORTACHIAVI=$RUNNER_TEMP/firma.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATO"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILO"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$PORTACHIAVI"
          security set-keychain-settings -lut 21600 "$PORTACHIAVI"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$PORTACHIAVI"
          security import "$CERTIFICATO" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$PORTACHIAVI"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$PORTACHIAVI"
          security list-keychain -d user -s "$PORTACHIAVI"
          security find-identity -v -p codesigning "$PORTACHIAVI"

          # Da Xcode 16 i profili stanno in UserData; la cartella storica resta per compatibilità.
          UUID=$(security cms -D -i "$PROFILO" | plutil -extract UUID raw -)
          for CARTELLA in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$CARTELLA"
            cp "$PROFILO" "$CARTELLA/$UUID.mobileprovision"
          done

      # Il numero di build è quello dell'esecuzione: App Store Connect vuole un numero
      # sempre crescente. Rilanciare la stessa esecuzione riusa il numero e viene rifiutato.
      - name: Archivia
        run: |
          xcodebuild archive \
            -project MirrorLoop.xcodeproj \
            -scheme MirrorLoop \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MirrorLoop.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Esporta il file .ipa firmato
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MirrorLoop.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
          ls -l "$RUNNER_TEMP/export"

      # --apple-id (l'ID numerico dell'app) evita un difetto noto di altool in Xcode 26,
      # che poteva associare la build all'app sbagliata.
      - name: Carica su App Store Connect
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$API_KEY_BASE64" | base64 --decode -o "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/MirrorLoop.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            --apple-id "$APP_ID_ASC"
