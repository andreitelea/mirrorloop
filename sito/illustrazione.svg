<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img">
  <!-- L'iPhone trasmette, il PC riceve, OBS manda in onda. Senza testo: vale per tutte le lingue. -->
  <style>
    .cornice { fill: #ffffff; stroke: #1b1b2a; }
    .schermo-pc { fill: #1d1c2b; }
    .pannello { fill: #33324a; }
    .piede { fill: #c9c7d8; }
    .onde { stroke: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .cornice { fill: #1d1c2b; stroke: #ececf4; }
      .schermo-pc { fill: #0b0b12; }
      .pannello { fill: #2a2940; }
      .piede { fill: #33324a; }
      .onde { stroke: #a58bff; }
    }
  </style>
  <defs>
    <linearGradient id="sfumatura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Il simbolo dell'icona (anello con il punto staccato), centrato in 0,0 con raggio 1. -->
    <mask id="stacco" maskContentUnits="userSpaceOnUse">
      <rect x="-2" y="-2" width="4" height="4" fill="#fff"/>
      <circle cx="0.707" cy="-0.707" r="0.393" fill="#000"/>
    </mask>
    <g id="simbolo">
      <circle r="1" fill="none" stroke="#fff" stroke-width="0.24" mask="url(#stacco)"/>
      <circle cx="0.707" cy="-0.707" r="0.307" fill="#fff"/>
    </g>
  </defs>

  <!-- iPhone -->
  <rect class="cornice" x="28" y="34" width="132" height="262" rx="26" stroke-width="5"/>
  <rect x="38" y="44" width="112" height="242" rx="18" fill="url(#sfumatura)"/>
  <rect class="cornice" x="76" y="52" width="36" height="10" rx="5" stroke-width="0" style="fill:#1b1b2a"/>
  <use href="#simbolo" transform="translate(94 165) scale(30)"/>

  <!-- Onde dal telefono al PC -->
  <g class="onde" fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M182 138 a40 40 0 0 1 0 54" opacity="0.45"/>
    <path d="M198 124 a58 58 0 0 1 0 82" opacity="0.7"/>
    <path d="M214 110 a76 76 0 0 1 0 110"/>
  </g>

  <!-- Monitor con OBS -->
  <rect class="cornice" x="250" y="40" width="290" height="190" rx="14" stroke-width="5"/>
  <rect class="schermo-pc" x="260" y="50" width="270" height="170" rx="6"/>
  <!-- Anteprima della scena: il telefono e la webcam -->
  <rect x="272" y="60" width="246" height="112" rx="4" fill="#12121c"/>
  <rect x="368" y="66" width="52" height="100" rx="9" fill="url(#sfumatura)"/>
  <use href="#simbolo" transform="translate(394 116) scale(13)"/>
  <circle cx="486" cy="146" r="18" fill="#3b3a55"/>
  <circle cx="486" cy="140" r="6" fill="#6d6b8a"/>
  <path d="M474 158 a12 10 0 0 1 24 0" fill="#6d6b8a"/>
  <!-- In onda -->
  <circle cx="285" cy="73" r="6" fill="#ef4444"/>
  <!-- Pannelli di OBS -->
  <rect class="pannello" x="272" y="180" width="76" height="30" rx="3"/>
  <rect class="pannello" x="356" y="180" width="76" height="30" rx="3"/>
  <rect class="pannello" x="440" y="180" width="78" height="30" rx="3"/>
  <rect x="280" y="190" width="40" height="4" rx="2" fill="#7c3aed"/>
  <rect x="364" y="190" width="52" height="4" rx="2" fill="#6d6b8a"/>
  <rect x="448" y="190" width="30" height="4" rx="2" fill="#6d6b8a"/>
  <!-- Piede del monitor -->
  <rect class="piede" x="378" y="232" width="34" height="34"/>
  <rect class="piede" x="340" y="264" width="110" height="10" rx="5"/>
</svg>
