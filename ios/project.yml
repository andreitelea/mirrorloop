# Descrizione del progetto Xcode per XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Il file .xcodeproj non sta nel repository: si rigenera con `xcodegen generate`
# dentro questa cartella, così le modifiche al progetto restano leggibili nelle diff.
name: MirrorLoop

options:
  bundleIdPrefix: io.github.andreitelea
  # I testi del codice sono in inglese, la lingua per chi non ha l'iPhone in italiano; le traduzioni
  # stanno nei cataloghi Localizable.xcstrings e InfoPlist.xcstrings (le lingue dei cataloghi
  # XcodeGen le aggiunge da solo alle regioni del progetto).
  developmentLanguage: en
  deploymentTarget:
    iOS: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.14.0"
    CURRENT_PROJECT_VERSION: "1"
    # Identificativo del team Apple Developer (non è un segreto: compare in ogni app firmata).
    DEVELOPMENT_TEAM: FVYL9M67QJ
    # Il compilatore elenca i testi da tradurre (file .stringsdata): il workflow controlla che
    # ognuno abbia la traduzione italiana nel catalogo.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  MirrorLoop:
    type: application
    platform: iOS
    sources:
      - MirrorLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.andreitelea.mirrorloop
        # Solo iPhone: l'iPad si valuterà più avanti.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Il viola dell'icona per pulsanti e selezioni (più chiaro in modalità scura).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # La Release si firma a mano con il certificato e il profilo che il workflow
      # importa dai segreti di GitHub: niente account Apple sulla macchina di compilazione.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: MirrorLoop App Store
    info:
      path: MirrorLoop/Info.plist
      properties:
        CFBundleDisplayName: MirrorLoop
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Senza questa chiave iOS mostrerebbe l'app in modalità compatibilità (con bande nere).
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # L'app non usa cifratura propria (solo quella di sistema): così App Store Connect
        # non chiede la dichiarazione sull'esportazione a ogni build.
        ITSAppUsesNonExemptEncryption: false
        # Senza questa modalità iOS 27 interrompe la cattura dello schermo intero appena
        # l'app va in background (guida Apple "Capturing screen content on iOS").
        UIBackgroundModes:
          - screen-capture
        # Testo mostrato da iOS quando chiede il permesso di usare la rete locale (in italiano in InfoPlist.xcstrings).
        NSLocalNetworkUsageDescription: MirrorLoop connects to the receiver on your PC over your home network to stream the screen.
        # Il tipo di servizio con cui il ricevitore si annuncia (Bonjour): senza, iOS blocca la ricerca dei PC.
        NSBonjourServices:
          - _mirrorloop._udp

  # Test dei calcoli dell'abbinamento su un iPhone simulato: Swift deve ottenere esattamente
  # l'esempio di docs/protocollo.md, come il ricevitore in C#. Compila Abbinamento.swift
  # direttamente, senza avviare l'app: l'app non si può compilare per il simulatore, dove
  # ScreenCaptureKit non c'è. Per questo ha uno schema tutto suo, "MirrorLoopTests".
  MirrorLoopTests:
    type: bundle.unit-test
    platform: iOS
    scheme:
      testTargets:
        - MirrorLoopTests
    sources:
      - MirrorLoopTests
      - path: MirrorLoop/Abbinamento.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.andreitelea.mirrorloop.test
        GENERATE_INFOPLIST_FILE: YES
