# Descrizione del progetto Xcode per XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Il file .xcodeproj non sta nel repository: si rigenera con `xcodegen generate`
# dentro questa cartella, così le modifiche al progetto restano leggibili nelle diff.
name: MirrorLoop

options:
  bundleIdPrefix: io.github.andreitelea
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MirrorLoop:
    type: application
    platform: iOS
    sources:
      - MirrorLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.andreitelea.mirrorloop
        # Solo iPhone: l'iPad si valuterà più avanti.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: MirrorLoop/Info.plist
      properties:
        CFBundleDisplayName: MirrorLoop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Senza questa chiave iOS mostrerebbe l'app in modalità compatibilità (con bande nere).
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
